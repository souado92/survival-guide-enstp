<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transport étudiant — Survival Guide ENSTP</title>
<style>
:root{--blue:#0288c8;--dark:#05608f;--cyan:#22c3e6;--card:#f1f6fa;--line:#dbe5ec;--tx:#14222d;--mut:#586976;--warn:#92400e;--warnbg:#fef3c7}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:#fff;overflow-x:hidden}:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}button{font:inherit;cursor:pointer}header{background:linear-gradient(135deg,var(--dark),var(--blue) 55%,var(--cyan));color:#fff;padding:22px 16px 18px}.wrap{max-width:820px;margin:auto}.brand{font-size:.8rem;font-weight:700;letter-spacing:.08em;opacity:.9}h1{margin:4px 0 6px;font-size:1.55rem;line-height:1.2}header p{margin:0;opacity:.95}nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px #0001}nav .wrap{display:flex;gap:4px;padding:6px 8px}nav button{flex:1;min-height:52px;border:0;border-radius:12px;background:none;color:var(--mut);font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}nav button span{font-size:1.2rem;line-height:1}nav button[aria-current=page]{background:var(--blue);color:#fff}main{max-width:820px;margin:auto;padding:16px 14px 8px}h2{font-size:1.25rem;margin:0 0 4px}h3{font-size:1rem;margin:18px 0 6px;color:var(--dark)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:1.35rem}}.big{width:100%;text-align:left;color:inherit;transition:transform .15s,border-color .15s}.big:hover{border-color:var(--cyan);transform:translateY(-2px)}.big .ic{font-size:2rem;display:block}.big b{font-size:1.15rem;display:block;margin-top:4px}.big small{color:var(--mut)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{min-height:44px;padding:8px 16px;border-radius:22px;border:1.5px solid var(--blue);background:#fff;color:var(--dark);font-weight:600}.chip[aria-pressed=true]{background:var(--blue);color:#fff}.btn{min-height:48px;padding:10px 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700}.btn.alt{background:#fff;color:var(--dark);border:2px solid var(--blue)}label{display:block;font-size:.88rem;font-weight:700;color:var(--dark);margin-top:10px}input,select{width:100%;min-height:48px;margin-top:4px;padding:8px 12px;border:1.5px solid #c3d0da;border-radius:12px;font:inherit;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.two{grid-template-columns:1fr}}.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.9rem;margin:8px 0}.badge{display:inline-block;background:var(--blue);color:#fff;border-radius:8px;padding:1px 10px;font-weight:700}.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;min-height:46px;border:0;border-radius:12px;background:#e2eaf0;font-weight:700;color:var(--dark)}.seg button[aria-pressed=true]{background:var(--blue);color:#fff}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--dark);font-size:.85rem;background:#e8f1f7}.tl{list-style:none;margin:10px 0 0;padding:0}.tl li{position:relative;padding:0 0 22px 58px;min-height:52px}.tl li:before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:5px;background:var(--blue);border-radius:3px}.tl li:last-child:before{display:none}.tl .n{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:3px solid var(--blue);background:#fff;color:var(--dark);font-weight:700;display:grid;place-items:center}.tl li.hit .n{background:var(--blue);color:#fff}.tl b{display:block}.ar{direction:rtl;text-align:left;color:var(--blue)}.tl a{font-size:.85rem;color:var(--dark);display:inline-block;padding:4px 0}.muted{color:var(--mut);font-size:.9rem}details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:10px 0}summary{min-height:48px;display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.kpi div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:1.3rem;color:var(--dark)}footer{max-width:820px;margin:auto;padding:16px;text-align:center;font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">🎓 SURVIVAL GUIDE ENSTP</div><h1>Transport étudiant — Survival Guide ENSTP</h1>
<p>Trouve ton arrêt, ta ligne et les horaires disponibles pour aller à l'ENSTP.</p></div></header>
<nav aria-label="Navigation principale"><div class="wrap" id="nav"></div></nav>
<main id="app"></main>
<footer id="foot"></footer>
<script src="data.js"></script>
<script>
const D = window.TRANSPORT_DATA, $ = s => document.querySelector(s);
const TABS = [["home","Accueil","🏠"],["search","Recherche","🔍"],["etusa","ETUSA","🚌"],["kous","KOUS","🚐"]];
let view = "home", sel = {line: null, point: "kouba", sens: "aller"};
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\u0600-\u06ff ]/g," ").replace(/\s+/g," ").trim();
const stops = l => l.aller.map(s => { const [fr, ar] = s.split("|"); return {fr, ar}; });
const lineById = id => D.etusa.lines.find(l => l.id === id);
const mapLink = s => `<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.fr+" Alger")}">📍 Google Maps</a>`;
const warn = t => `<div class="warn">⚠️ ${t}</div>`;
function go(v){ view = v; render(); scrollTo(0,0); }
function showLine(id){ sel.line = id; sel.point = "kouba"; go("etusa"); }
function render(){
  $("#nav").innerHTML = TABS.map(([k,t,i]) => `<button ${k===view?'aria-current="page"':""} onclick="go('${k}')"><span aria-hidden="true">${i}</span>${t}</button>`).join("");
  $("#app").innerHTML = ({home,search,etusa,kous})[view]();
  const v = D.meta.lastVerified;
  $("#foot").innerHTML = `${D.meta.disclaimer}.<br>Dernière vérification : ${v || "non vérifié"}`;
  if (view === "search") { fillLines(); runSearch(); }
}
function home(){ return `
 <div class="grid">
  <button class="card big" onclick="go('etusa')"><span class="ic">🚌</span><b>ETUSA</b><small>${D.etusa.lines.length} lignes (${D.etusa.lines.map(l=>l.id).join(", ")}), arrêts dans l'ordre</small></button>
  <button class="card big" onclick="go('kous')"><span class="ic">🚐</span><b>KOUS</b><small>Destinations, horaires et fréquences</small></button>
 </div>
 <div class="card"><h2>Rechercher un arrêt ou un lieu</h2>
  <label for="q0">Arrêt, ligne ou destination</label>
  <input id="q0" type="search" placeholder="Ex. : Belcourt, L33, Bouzaréah…" onkeydown="if(event.key==='Enter')qGo()">
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="qGo()">Rechercher</button><button class="btn alt" onclick="go('etusa')">Lignes et horaires</button></div></div>
 <div class="card"><h2>Départs ETUSA</h2><div class="muted">Choisis ton point de départ</div>
  <div class="chips">${D.etusa.points.map(p=>`<button class="chip" onclick="sel.point='${p.id}';go('etusa')">${p.name}</button>`).join("")}</div></div>
 ${warn(D.meta.disclaimer)}`; }
function qGo(){ window._q = $("#q0").value; go("search"); }
function search(){ return `
 <div class="card"><h2>Recherche</h2>
  <div class="two">
   <div><label for="sc">Transporteur</label><select id="sc" onchange="fillLines();runSearch()"><option value="all">Tous</option><option value="etusa">ETUSA</option><option value="kous">KOUS</option></select></div>
   <div id="fp"><label for="sp">Point de départ ETUSA</label><select id="sp" onchange="fillLines();runSearch()"><option value="">Tous</option>${D.etusa.points.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div>
   <div id="fl"><label for="sl">Ligne ETUSA</label><select id="sl" onchange="runSearch()"></select></div>
   <div><label for="sq">Arrêt ou destination</label><input id="sq" type="search" value="${window._q||""}" oninput="runSearch()" placeholder="Ex. : Place Audin"></div>
  </div></div><div id="res" aria-live="polite"></div>`; }
function fillLines(){
  const c = $("#sc").value, p = $("#sp").value;
  $("#fp").hidden = $("#fl").hidden = c === "kous";
  const ids = p ? D.etusa.points.find(x=>x.id===p).lines : D.etusa.lines.map(l=>l.id), cur = $("#sl").value;
  $("#sl").innerHTML = `<option value="">Toutes</option>` + ids.map(i=>`<option ${i===cur?"selected": ""}>${i}</option>`).join("");
}
function runSearch(){
  const c = $("#sc").value, p = $("#sp").value, ln = $("#sl").value, q = norm($("#sq").value); let out = "", n = 0;
  if (c !== "kous") {
    const ids = p ? D.etusa.points.find(x=>x.id===p).lines : D.etusa.lines.map(l=>l.id);
    D.etusa.lines.filter(l => ids.includes(l.id) && (!ln || l.id===ln)).forEach(l => {
      const hits = stops(l).map((s,i)=>({...s,i})).filter(s => !q || norm(s.fr).includes(q) || norm(s.ar).includes(q) || norm(l.id)===q);
      if (hits.length && (q || ln || p)) { n++; out += `<div class="card"><span class="badge">${l.id}</span> <b>ETUSA</b> · sens aller
        ${hits.slice(0,30).map(h=>`<div style="padding:4px 0">#${h.i+1} <b>${h.fr}</b> <span class="ar muted">${h.ar}</span></div>`).join("")}
        <button class="btn alt" style="margin-top:8px" onclick="showLine('${l.id}')">Voir la ligne</button></div>`; }
    });
  }
  if (c !== "etusa" && !ln && !p) D.kous.routes.filter(r => !q || norm(r.title+" "+r.ar+" "+(r.stops||[]).flat().join(" ")).includes(q)).forEach(r => { if (q || c==="kous") { n++; out += kousCard(r); } });
  $("#res").innerHTML = out ? `<div class="muted">${n} résultat(s)</div>${out}` : (q||ln||p ? `<div class="card">Aucun résultat dans les données disponibles.</div>` : `<div class="card muted">Saisis un lieu ou choisis un filtre.</div>`);
}
function etusa(){
  const P = D.etusa.points, p = P.find(x => x.id===sel.point) || P[0], dep = p.departures;
  const ls = p.lines.map(lineById), pos = l => stops(l).findIndex(s => s.fr===p.stopFr) + 1;
  const open = l => l.id===sel.line || (!ls.some(x=>x.id===sel.line) && l===ls[0]);
  return `<div class="chips" role="group" aria-label="Point de départ">${P.map(x=>`<button class="chip" aria-pressed="${x.id===p.id}" onclick="sel.point='${x.id}';render()">${x.name}</button>`).join("")}</div>
  <div class="card"><h2>Départ : ${p.name}</h2><div class="ar muted">${p.ar}</div>
   <h3>🕐 Horaires de départ</h3>
   ${dep ? `<div class="scroll"><table><tr><th>Première course</th><th>Dernière course</th><th>Fréquence de passage</th></tr><tr><td><b>${dep.first}</b></td><td><b>${dep.last}</b></td><td>Toutes les ${dep.every}</td></tr></table></div>${warn("Horaires à confirmer auprès d'ETUSA. Non précisés ligne par ligne.")}`
         : warn("Aucun horaire de départ fourni dans les documents pour ce point : horaires à confirmer auprès d'ETUSA.")}
   <h3>🚌 Lignes ETUSA</h3>
   <div class="scroll"><table><tr><th>Ligne</th><th>Sens</th><th>Rang de l'arrêt</th></tr>
   ${ls.map(l=>`<tr><td><span class="badge">${l.id}</span></td><td>Aller</td><td>${pos(l)} / ${l.aller.length}</td></tr>`).join("")}</table></div>
   <h3>📍 Stations</h3><div class="muted">Parcours des captures, dans l'ordre affiché (départ : Station Intermodale de Kouba).</div>
   ${ls.map(l=>`<details ${open(l)?"open": ""}><summary><span class="badge">${l.id}</span> ${l.aller.length} arrêts</summary>
     <div class="seg" role="group" aria-label="Sens ${l.id}"><button aria-pressed="${sel.sens==='aller'}" onclick="sel.line='${l.id}';sel.sens='aller';render()">Sens aller</button><button aria-pressed="${sel.sens==='retour'}" onclick="sel.line='${l.id}';sel.sens='retour';render()">Sens retour</button></div>
     ${sel.sens==="aller" ? `<ol class="tl">${stops(l).map((s,j)=>`<li class="${s.fr===p.stopFr?"hit": ""}"><span class="n">${j+1}</span><b>${s.fr}</b><span class="ar">${s.ar}</span>${mapLink(s)}</li>`).join("")}</ol>`
        : `<div class="warn">Stations du sens retour non disponibles pour le moment.</div>`}</details>`).join("")}
  </div>`; }
function kousCard(r){
  const st = r.stops ? `<div class="kpi"><div>🕐 Premier départ<b>${r.first}</b></div><div>🔁 Fréquence<b style="font-size:1.05rem">${r.freq}</b></div></div>
    <ol class="tl">${r.stops.map((s,i)=>`<li><span class="n">${i+1}</span><b class="ar">${s[0]}</b><span class="muted">${s[1]}</span></li>`).join("")}</ol>` : "";
  return `<div class="card">${r.title?`<b>${r.title}</b><div class="ar">${r.ar}</div>`: ""}${r.times?`<div style="margin-top:6px">🕐 Horaires : <b>${r.times}</b></div>`: ""}${st}</div>`; }
function kous(){ return `<h2>KOUS</h2>${D.kous.routes.map(kousCard).join("")}`; }
render();
</script>
</body>
</html>
